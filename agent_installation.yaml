---
- name: Install and configure Zabbix Agent 2 on RHEL
  hosts: all
  become: true
  vars:
    zabbix_server_ip: "192.168.0.177"   # <-- Zabbix server / proxy IP
    zabbix_agent_version: "7.4"         # <-- 7.4 is the branch with el10 builds; check repo.zabbix.com if this changes

  tasks:
    - name: Show detected OS
      debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_major_version }}"

    - name: Remove any stale/mismatched Zabbix repo package
      yum:
        name: zabbix-release
        state: absent

    - name: Remove stale zabbix.repo file if present
      file:
        path: /etc/yum.repos.d/zabbix.repo
        state: absent

    - name: Clean dnf cache
      command: dnf clean all
      changed_when: false

    - name: Install correct Zabbix repository for this OS
      yum:
        name: "https://repo.zabbix.com/zabbix/{{ zabbix_agent_version }}/release/rhel/{{ ansible_distribution_major_version }}/noarch/zabbix-release-latest.el{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        disable_gpg_check: yes

    - name: Clean dnf cache after repo install
      command: dnf clean all
      changed_when: false

    - name: Install Zabbix Agent 2
      yum:
        name: zabbix-agent2
        state: present
        update_cache: yes

    - name: Configure Zabbix agent - Server
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^Server='
        line: "Server={{ zabbix_server_ip }}"
        backup: yes
      notify: restart zabbix-agent2

    - name: Configure Zabbix agent - ServerActive
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}"
        backup: yes
      notify: restart zabbix-agent2

    - name: Configure Zabbix agent - Hostname
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^Hostname='
        line: "Hostname={{ inventory_hostname }}"
        backup: yes
      notify: restart zabbix-agent2

    - name: Ensure firewalld allows Zabbix agent port (10050)
      firewalld:
        port: 10050/tcp
        permanent: yes
        state: enabled
        immediate: yes
      when: ansible_facts.services is defined and "firewalld.service" in ansible_facts.services
      ignore_errors: yes

    - name: Enable and start zabbix-agent2 service
      systemd:
        name: zabbix-agent2
        enabled: yes
        state: started

  handlers:
    - name: restart zabbix-agent2
      systemd:
        name: zabbix-agent2
        state: restarted
