---
- name: Install and configure Zabbix Agent 2 on RHEL
  hosts: all
  become: true
  vars:
    zabbix_server_ip: "192.168.0.177"   # <-- Zabbix server / proxy IP
    zabbix_agent_version: "7.0"         # <-- verify this version ships a repo for your RHEL major version

  tasks:
    - name: Show detected OS
      debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_major_version }}"

    - name: Check if Zabbix repo package is already configured
      stat:
        path: /etc/yum.repos.d/zabbix.repo
      register: zabbix_repo_file

    - name: Install Zabbix repository
      yum:
        name: "https://repo.zabbix.com/zabbix/{{ zabbix_agent_version }}/rhel/{{ ansible_distribution_major_version }}/x86_64/zabbix-release-{{ zabbix_agent_version }}-1.el{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        disable_gpg_check: yes
      when: not zabbix_repo_file.stat.exists

    - name: Clean yum cache after repo install
      command: yum clean all
      changed_when: false
      when: not zabbix_repo_file.stat.exists

    - name: Install Zabbix Agent 2
      yum:
        name: zabbix-agent2
        state: present
        update_cache: yes

    - name: Configure Zabbix agent - Server
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^Server='
        line: "Server={{ zabbix_server_ip }}"
        backup: yes
      notify: restart zabbix-agent2

    - name: Configure Zabbix agent - ServerActive
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^ServerActive='
        line: "ServerActive={{ zabbix_server_ip }}"
        backup: yes
      notify: restart zabbix-agent2

    - name: Configure Zabbix agent - Hostname
      lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: '^Hostname='
        line: "Hostname={{ inventory_hostname }}"
        backup: yes
      notify: restart zabbix-agent2

    - name: Ensure firewalld allows Zabbix agent port (10050)
      firewalld:
        port: 10050/tcp
        permanent: yes
        state: enabled
        immediate: yes
      when: ansible_facts.services is defined and "firewalld.service" in ansible_facts.services
      ignore_errors: yes

    - name: Enable and start zabbix-agent2 service
      systemd:
        name: zabbix-agent2
        enabled: yes
        state: started

  handlers:
    - name: restart zabbix-agent2
      systemd:
        name: zabbix-agent2
        state: restarted
