# ============================================================================
# Playbook: SSL Certificate Expiry Check and Markdown Report
# ============================================================================
#
# Description:
#   This playbook runs on the control node (localhost) to check SSL/TLS
#   certificate expiration for a list of remote hosts (FQDNs). It:
#   1. Validates OS compatibility (RHEL/CentOS 7/8/9)
#   2. Validates input variables (sites list, warn_days, critical_days)
#   3. Fetches certificates for each site via TLS on port 443
#   4. Builds a report with expiration date, days left, and status
#   5. Writes a Markdown report to /tmp (configurable via report_path)
#
#   Failed certificate fetches (e.g. network/timeout) do not stop the play;
#   only successfully retrieved certs are included in the report.
#
# Author: GCG + JAPAN AAP SSA Team（TOMOAKI Nakajima）  + v3.01 20260303
#
# License:
#   License Type: End User License Agreement (EULA)
#   Authorization: Subscription-based License
#
# ============================================================================

---
- name: "SSL Certificate Expiry Check and Markdown Report"
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    warn_days: 30
    critical_days: 10
    report_filename: "ssl_report.md"
    # Report path: under /tmp for consistency (playbook_dir is Ansible magic var if you need it)
    report_path: "/tmp/{{ report_filename }}"
    # Display timezone offset in seconds (28800 = Beijing time UTC+8)
    timezone_offset_seconds: 28800
    sites:
      - www.google.com
      - github.com
      - openai.com
      - www.cloudflare.com
      - www.ft.com
      - expired.badssl.com
      - expired-rsa-dv.ssl.com

  tasks:
    # ------------------------------------------------------------------------
    # OS compatibility
    # ------------------------------------------------------------------------
    - name: "Validate OS compatibility"
      ansible.builtin.assert:
        that:
          - ansible_distribution in ["RedHat", "CentOS"]
          - ansible_distribution_major_version in ["7", "8", "9"]
        fail_msg: "Unsupported operating system. This playbook is not available for the current OS."
        success_msg: "OS compatibility passed: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
      tags:
        - validation
        - always

    - name: "Display OS information"
      ansible.builtin.debug:
        msg:
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
          - "Hostname: {{ ansible_hostname }}"
      tags:
        - validation
        - debug

    # ------------------------------------------------------------------------
    # Input validation
    # ------------------------------------------------------------------------
    - name: "Validate input variables"
      ansible.builtin.assert:
        that:
          - sites is defined
          - sites | length > 0
          - warn_days | int >= 0
          - critical_days | int >= 0
        fail_msg: "Invalid input. Ensure 'sites' is a non-empty list and 'warn_days' / 'critical_days' are non-negative integers."
        success_msg: "Input validation passed. Sites count: {{ sites | length }}, warn_days: {{ warn_days }}, critical_days: {{ critical_days }}"
      tags:
        - validation
        - always

    - name: "Display validated inputs"
      ansible.builtin.debug:
        msg:
          - "Sites to check: {{ sites }}"
          - "Warn threshold (days): {{ warn_days }}, Critical threshold (days): {{ critical_days }}"
      tags:
        - validation
        - debug

    # ------------------------------------------------------------------------
    # Fetch certificates (per-site failures do not stop the play)
    # ------------------------------------------------------------------------
    - name: "Fetch SSL certificates for each site"
      community.crypto.get_certificate:
        host: "{{ item }}"
        port: 443
      loop: "{{ sites }}"
      loop_control:
        label: "{{ item }}"
      register: cert_results
      failed_when: false

    - name: "Display certificate fetch summary"
      ansible.builtin.debug:
        msg:
          - "Certificate fetch completed."
          - "Total: {{ cert_results.results | length }}, Failed: {{ cert_results.results | selectattr('failed') | list | length }}, Succeeded: {{ cert_results.results | length - (cert_results.results | selectattr('failed') | list | length) }}"
      tags:
        - debug

    # ------------------------------------------------------------------------
    # Build report rows from successful results only
    # ------------------------------------------------------------------------
    - name: "Initialize report rows list"
      ansible.builtin.set_fact:
        report_rows: []

    - name: "Build report rows from successful certificate results"
      ansible.builtin.set_fact:
        report_rows: "{{ report_rows + [{
          'domain': item.item,
          'expires_at': expiry_display,
          'days_left': days_left,
          'emoji': status_emoji
        }] }}"
      vars:
        # .strftime('%s') returns string; use | int so arithmetic never does str+int
        not_after_epoch: "{{ (item.not_after | to_datetime('%Y%m%d%H%M%SZ')).strftime('%s') | int }}"
        now_epoch: "{{ now(utc=true, fmt='%s') | int }}"
        days_left: "{{ (((not_after_epoch | int) - (now_epoch | int)) / 86400) | int }}"
        # Avoid Ansible strftime filter: use system date with TZ=Asia/Shanghai (Beijing time)
        expiry_display: "{{ lookup('pipe', 'TZ=Asia/Shanghai date -d @' ~ (not_after_epoch | int | string) ~ \" '+%Y-%m-%d %H:%M:%S Beijing time'\") }}"
        status_emoji: "{{ '☠️' if (days_left | int) <= 0 else ('🚨' if (days_left | int) <= critical_days else ('⚠️' if (days_left | int) <= warn_days else '🟢')) }}"
      loop: "{{ cert_results.results }}"
      when: not (item.failed | default(false))

    - name: "Display report row count"
      ansible.builtin.debug:
        msg: "Report rows built: {{ report_rows | length }}"
      tags:
        - debug

    # ------------------------------------------------------------------------
    # Generate Markdown report (block/rescue for robustness)
    # ------------------------------------------------------------------------
    - name: "Generate Markdown report"
      block:
        - name: "Set report created_at (Beijing time via date, avoid strftime)"
          ansible.builtin.set_fact:
            report_created_at: "{{ lookup('pipe', 'TZ=Asia/Shanghai date \"+%Y-%m-%d %H:%M:%S Beijing time\"') }}"

        - name: "Write SSL certificate report to file"
          ansible.builtin.template:
            src: ssl_report.md.j2
            dest: "{{ report_path }}"
            mode: "0644"

        - name: "Report path"
          ansible.builtin.debug:
            msg: "Report written to: {{ report_path }}"
      rescue:
        - name: "Handle report write failure"
          ansible.builtin.debug:
            msg: "Warning: Failed to write report to {{ report_path }}. Check permissions and path."
          ignore_errors: true
